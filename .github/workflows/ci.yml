name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85
      - name: CLI smoke test
        shell: bash
        run: |
          stl-doctor --version
          stl-doctor check tests/fixtures/cube_binary.stl --report report.html
          stl-doctor check tests/fixtures/overhang_t_ascii.stl --json > report.json
          stl-doctor repair tests/fixtures/cube_missing_face_binary.stl fixed.stl
          stl-doctor check fixed.stl --strict
          stl-doctor orient tests/fixtures/overhang_t_binary.stl --top 1
          set +e
          stl-doctor check tests/fixtures/nonmanifold_edge_binary.stl
          test $? -eq 2
      - name: Pure-Python path (numpy removed)
        run: |
          python -m pip uninstall -y numpy
          pytest -q tests/test_printability.py tests/test_checks.py

  registry:
    # The printer and material registry is vendored from gcode-insight (the canonical copy).
    # Both files must be byte-identical to the pinned release; see gcode-insight docs/registry.md.
    name: registry matches gcode-insight v0.4.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare vendored registry files
        run: |
          base=https://raw.githubusercontent.com/projectbin07-stack/gcode-insight/v0.4.0/src/gcode_insight
          for f in registry.py print_registry.json; do
            curl -fsSL "$base/$f" -o "/tmp/$f"
            cmp "/tmp/$f" "src/stl_doctor/$f"
            echo "$f matches gcode-insight v0.4.0"
          done
