[build-system]
requires = ["hatchling>=1.21,<2"]
build-backend = "hatchling.build"

[project]
name = "stl-doctor"
dynamic = ["version"]
description = "Inspect STL and 3MF meshes for 3D-printing problems before slicing, and explain what is wrong and where."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Navaneeth KG" }]
keywords = ["stl", "3mf", "3d-printing", "mesh", "manifold", "mesh-repair", "bambu-lab", "fdm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Printing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
fast = ["numpy>=1.24,<3"]
dev = [
    "mypy>=1.11,<3",
    "numpy>=1.24,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[project.scripts]
stl-doctor = "stl_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/projectbin07-stack/stl-doctor"
Issues = "https://github.com/projectbin07-stack/stl-doctor/issues"
Changelog = "https://github.com/projectbin07-stack/stl-doctor/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/stl_doctor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/stl_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
mypy_path = ["src", "tests"]
explicit_package_bases = true

[tool.coverage.run]
source = ["stl_doctor"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
